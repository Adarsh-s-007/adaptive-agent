name: ci
on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: backend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e '.[dev]'
      - run: ruff check app tests alembic ../scripts
      - run: ruff format --check app tests alembic
      - name: Only the gateways may call Hindsight or Groq
        run: |
          ! grep -rnE "hindsight_client|api\.hindsight|vectorize\.io" app --include=*.py | grep -v gateways/hindsight_gateway.py | grep -v core/config.py
          ! grep -rnE "import groq|api\.groq\.com" app --include=*.py | grep -v gateways/llm_gateway.py
      - run: pytest -q
        env: {DATABASE_URL: "sqlite+aiosqlite:///./ci.db", APP_ACCESS_TOKEN: ci-token}

  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: gitleaks/gitleaks-action@v2
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
