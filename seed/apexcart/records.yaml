# Owner: P3. The 13 seeded ApexCart records (blueprint 25.1). All data is synthetic.
# seed_key makes POST /memories idempotent. A07 is superseded live by L3 (session S-131).
- seed_key: A01
  type: decision
  area: database
  decided_at: "2026-04-08"
  importance: 2
  title: Money in integer minor units
  statement: Store all money as integer minor units (amount_cents, currency ISO-4217). Never use floats or Decimal in TypeScript for prices.
  rationale: Classic rounding bugs in order totals, discounts and refunds.
  applies_to: [price, order totals, discounts, refunds, amount_cents]
  check_patterns: {forbidden: ["parseFloat\\(.*price", "toFixed\\(2\\)"]}
- seed_key: A02
  type: api_contract
  area: api
  decided_at: "2026-04-15"
  importance: 2
  title: Route handler response envelope
  statement: "All route handlers return { success: boolean, data?: T, error?: { code: string, message: string } } with an HTTP status matching the error."
  rationale: Clients parse one response shape.
  applies_to: [endpoint, route handler, app/api, response]
- seed_key: A03
  type: convention
  area: api
  decided_at: "2026-04-22"
  importance: 2
  title: Route handler location and validation
  statement: Route handlers live at app/api/<resource>/route.ts and validate input with zod schemas from lib/validation.
  rationale: Consistent structure across endpoints.
  applies_to: [new endpoint, route.ts, zod, validation]
- seed_key: A04
  type: security_constraint
  area: observability
  decided_at: "2026-05-06"
  importance: 3
  title: No PII in logs
  statement: Never log email, address, phone or payment details; use logger.redact() on user objects.
  rationale: PII compliance.
  applies_to: [logging, debugging, error handling, logger]
- seed_key: A05
  type: decision
  area: payments
  decided_at: "2026-05-20"
  importance: 3
  title: Stripe webhook handling
  statement: The Stripe webhook route reads the raw body with await req.text(), verifies with stripe.webhooks.constructEvent, runs on the nodejs runtime, and records event.id in stripe_events for idempotency.
  rationale: Signature failures and double processing happened before.
  applies_to: [webhook, stripe, payment events, payment_intent]
- seed_key: A06
  type: incident
  area: database
  decided_at: "2026-06-02"
  importance: 3
  title: Prisma client singleton
  statement: /checkout returned 504s because handlers created new PrismaClient() per request and exhausted connections. Always import the singleton db from @/lib/db.
  rationale: Recurring footgun that took checkout down.
  applies_to: [database access, prisma, performance, checkout]
  check_patterns: {forbidden: ["new PrismaClient\\("]}
- seed_key: A07
  type: decision
  area: database
  decided_at: "2026-06-02"
  importance: 2
  title: API connection limit
  statement: Set connection_limit=25 on the API DATABASE_URL.
  rationale: Sized for the June traffic profile on a single server.
  applies_to: [database configuration, DATABASE_URL, connection pool]
- seed_key: A08
  type: failed_approach
  area: checkout
  decided_at: "2026-06-18"
  importance: 3
  title: Carts are not stored in Redis
  statement: Tried storing carts in Redis with a 24 h TTL; carts vanished for returning users. Reverted. Carts live in the Postgres carts table; Redis is only for rate limiting.
  rationale: Returning users lost their carts when the TTL expired.
  applies_to: [cart persistence, sessions, caching, redis]
- seed_key: A09
  type: decision
  area: database
  decided_at: "2026-07-01"
  importance: 3
  title: Orders are soft-deleted
  statement: Orders and order items are soft-deleted via deleted_at; never hard-delete. All order queries filter deleted_at IS NULL.
  rationale: 7-year tax retention.
  applies_to: [order deletion, admin tools, reporting, orders]
  check_patterns: {forbidden: ["prisma\\.order\\.delete\\("]}
- seed_key: A10
  type: deployment
  area: infra
  decided_at: "2026-07-14"
  importance: 3
  title: Migrations only through CI
  statement: Only CI runs prisma migrate deploy using DIRECT_URL; never run prisma migrate dev against staging or production.
  rationale: A production schema drift incident.
  applies_to: [migrations, schema changes, deploy, prisma migrate]
- seed_key: A11
  type: convention
  area: frontend
  decided_at: "2026-07-29"
  importance: 2
  title: Shared UI components and tokens
  statement: Shared UI components live in components/ui and use Tailwind design tokens (no hex values, no inline styles). Server Components by default; add "use client" only for interactivity.
  rationale: Consistent UI.
  applies_to: [component, styling, ui, tailwind, header]
- seed_key: A12
  type: security_constraint
  area: auth
  decided_at: "2026-08-12"
  importance: 3
  title: Auth endpoint rate limit
  statement: Auth endpoints are rate-limited to 5 requests/min/IP with @upstash/ratelimit; over-limit returns 429 with error code RATE_LIMITED.
  rationale: Credential-stuffing incident.
  applies_to: [login, signup, password reset, auth endpoint]
  check_patterns: {required: ["@upstash/ratelimit", "RATE_LIMITED"]}
- seed_key: A13
  type: preference
  area: testing
  decided_at: "2026-08-26"
  importance: 1
  title: Every bug fix ships a regression test
  statement: "Every bug fix ships a regression test: Vitest for logic, Playwright for flows."
  rationale: Team rule.
  applies_to: [bug fix, regression test, vitest, playwright]
